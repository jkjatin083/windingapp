<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contractor</title>
<style>
*{box-sizing:border-box}
:root{--g:#1f6f4a;--ink:#1a1a1a;--mute:#8a8a85;--line:#dcdcd6;--soft:#f3f7f4}
body{margin:0;background:#f3f2ee;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);font-size:17px}
.w{max-width:460px;margin:0 auto;padding:18px 18px 96px}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px 22px;margin-top:10px}
h1{font-size:30px;margin:0}.sub{color:var(--mute);font-size:15px;margin:6px 0 22px}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 18px;border-radius:30px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:17px;color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.fixed{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--line);padding:6px 0 12px;font-size:22px}
.fixed small{color:var(--g);font-size:14px}
input.num{width:100%;border:0;border-bottom:1.5px solid var(--line);font:inherit;font-size:44px;font-weight:700;padding:4px 0 10px;background:transparent;outline:none;border-radius:0}
.box{background:var(--soft);border-radius:20px;padding:16px 18px;margin-top:22px}
.box .k{color:var(--mute);font-size:14px}.box .v{color:var(--g);font-size:32px;font-weight:700}
.btn{width:100%;margin-top:24px;border:0;border-radius:40px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:20px;padding:17px}
.btn:disabled{opacity:.5}
.err{color:#b3261e;font-size:15px;margin-top:12px;min-height:20px}
.note{color:var(--mute);font-size:14px;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 0 16px}
nav a{color:var(--mute);text-decoration:none;font-size:16px;padding:6px 18px}nav a.on{color:var(--g);font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 3px;border-bottom:2px solid var(--ink)}
td{padding:11px 3px;border-bottom:1px solid var(--line)}td.h{color:var(--g);font-weight:700}
.tc{border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.tc b{font-size:19px}.tc .row{display:flex;gap:18px;margin-top:10px}.tc .row div{flex:1}
.tc .row span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.tc .row em{font-style:normal;font-size:26px;font-weight:700}
.bar{height:10px;border:1px solid #bbb;border-radius:5px;margin-top:12px}.bar i{display:block;height:100%;background:var(--g);border-radius:4px}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 20px;border-radius:30px;display:none;z-index:9}
a.lo{color:var(--mute);font-size:14px}
</style></head><body><div class="w">
<div id="toast"></div>
<div style="display:flex;justify-content:space-between;align-items:center"><span class="sub" style="margin:0" id="who"></span><a class="lo" href="#" id="lo">Log out</a></div>
<div id="main"></div>
</div>
<nav><a href="#made" id="n_made">Made</a><a href="#give" id="n_give">Give</a><a href="#report" id="n_report">Report</a></nav>
<script>
const ME=localStorage.getItem('wa_name'),TOKEN=localStorage.getItem('wa_token');
if(!TOKEN||!['Suman','Dinesh','Ajeet','Siraj','Sunil'].includes(ME)){location.href='index.html'}
const NEXT=ME==='Sunil'?'Sunil (ready)':'Pandey ji';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-IN');
const dm=d=>{const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return +d.slice(8,10)+' '+m[+d.slice(5,7)-1]};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
async function api(url,opt){opt=opt||{};opt.headers=Object.assign({},opt.headers||{},{Authorization:'Bearer '+TOKEN});
 const r=await fetch(url,opt);if(r.status===401){localStorage.removeItem('wa_token');location.href='index.html';return}
 const j=await r.json();if(!r.ok)throw new Error(j.error||'error');return j}
$('lo').onclick=e=>{e.preventDefault();localStorage.removeItem('wa_token');localStorage.removeItem('wa_name');location.href='index.html'};
let H=null,sel={stype:null,issue:null},rtab='date';
async function home(){H=await api('/api/c?view=home');
 if(!sel.stype||!H.types.includes(sel.stype))sel.stype=H.types[0]||null;
 if(!H.issues.find(x=>x.id===sel.issue))sel.issue=H.issues.length?H.issues[0].id:null}
function chips(list,cur,fn,lab){return '<div class="chips">'+list.map(x=>'<button class="chip'+(x[0]===cur?' on':'')+'" data-v="'+esc(x[0])+'">'+esc(x[1])+'</button>').join('')+'</div>'}
function pick(root,fn){root.querySelectorAll('.chip').forEach(b=>b.onclick=()=>fn(b.dataset.v))}
function entryForm(kind){
 const give=kind==='give';
 let h='<div class="card"><h1>'+(give?'Give to '+esc(NEXT):'Made today')+'</h1><div class="sub">'+esc(ME)+' | '+dm(H.today)+'</div>';
 h+='<div class="lab">Stamping type</div>';
 h+=H.types.length?'<div id="st">'+chips(H.types.map(t=>[t,t]),sel.stype)+'</div>':'<div class="note">No stamping type yet. Ask Jatin.</div>';
 h+='<div class="lab">Winding type</div>';
 if(H.issues.length>1)h+='<div id="is">'+chips(H.issues.map(i=>[String(i.id),i.winding_type+' | #'+i.order_no]),String(sel.issue))+'</div>';
 else if(H.issues.length===1)h+='<div class="fixed"><span>'+esc(H.issues[0].winding_type)+'</span><small>from order #'+esc(H.issues[0].order_no)+'</small></div>';
 else h+='<div class="fixed"><span>-</span><small>no open order</small></div>';
 h+='<div class="lab">'+(give?'Stators given':'Stators made')+'</div><input class="num" id="q" type="number" inputmode="numeric" min="1" placeholder="0">';
 if(give){const x=H.holds[sel.stype]||{held:0};h+='<div class="box"><div class="k">You hold</div><div class="v" id="hv">'+fmt(x.held)+'</div><div class="k" id="hk">enter a number to see balance after giving</div></div><div class="note">Cannot give more than you hold.</div>'}
 else h+='<div class="box"><div class="k">Made today so far (auto)</div><div class="v">'+fmt(H.madeToday)+'</div></div>'+(H.issues.length===1||sel.issue?'<div class="note">'+(()=>{const i=H.issues.find(x=>x.id===sel.issue);return i?'Order #'+esc(i.order_no)+': '+fmt(i.left)+' left to wind':''})()+'</div>':'');
 h+='<button class="btn" id="go">'+(give?'Give':'Save')+'</button><div class="err" id="err"></div></div>';
 $('main').innerHTML=h;
 if($('st'))pick($('st'),v=>{sel.stype=v;entryForm(kind)});
 if($('is'))pick($('is'),v=>{sel.issue=+v;entryForm(kind)});
 if(give)$('q').oninput=()=>{const x=H.holds[sel.stype]||{held:0},q=+$('q').value||0;$('hk').textContent=q?('after giving: '+fmt(x.held-q)):'enter a number to see balance after giving';$('hk').style.color=(x.held-q<0)?'#b3261e':''};
 $('go').onclick=async()=>{const q=+$('q').value;$('err').textContent='';
  if(!sel.stype){$('err').textContent='Choose the stamping type';return}
  if(!(q>0)||q!==Math.floor(q)){$('err').textContent='Enter a whole number above 0';return}
  $('go').disabled=true;
  try{await api('/api/c',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:give?'give':'made',stype:sel.stype,qty:q,issue_id:sel.issue})});
   toast('Saved');await home();entryForm(kind)}catch(e){$('err').textContent=e.message;$('go').disabled=false}}
}
async function report(){
 const R=await api('/api/c?view=report');
 let h='<div class="card"><h1>My report</h1><div class="sub">'+esc(ME)+' | only my data</div><div class="tabs">'+
  [['date','Date-wise'],['type','By type'],['order','By order']].map(t=>'<button class="chip'+(rtab===t[0]?' on':'')+'" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
 if(rtab==='date'){
  h+='<div class="note" style="margin:0 0 8px">'+dm(R.from)+' - '+dm(R.to)+'</div>';
  if(!R.rows.length)h+='<div class="note">No entries yet.</div>';
  else{h+='<table><tr><th>Date</th><th>Stamp</th><th>Wind</th><th>Made</th><th>Given</th><th>Held</th></tr>';
   R.rows.slice().reverse().forEach(r=>h+='<tr><td>'+dm(r.d)+'</td><td>'+esc(r.stype)+'</td><td>'+esc(r.wt)+'</td><td>'+fmt(r.made)+'</td><td>'+fmt(r.given)+'</td><td class="h">'+fmt(r.held)+'</td></tr>');
   h+='</table>';
   const m=R.rows.reduce((a,r)=>a+r.made,0),g=R.rows.reduce((a,r)=>a+r.given,0),held=Object.values(R.holds).reduce((a,x)=>a+x.held,0);
   h+='<div class="box"><div class="k">Total made</div><b>'+fmt(m)+'</b> <span class="k">| given </span><b>'+fmt(g)+'</b><div class="k" style="margin-top:8px">Held now</div><div class="v">'+fmt(held)+'</div></div>'}
 } else if(rtab==='type'){
  const o={};R.rows.forEach(r=>{const k=r.stype+'|'+r.wt;const x=o[k]||(o[k]={s:r.stype,w:r.wt,m:0,g:0});x.m+=r.made;x.g+=r.given});
  const L=Object.values(o);
  if(!L.length)h+='<div class="note">No entries yet.</div>';
  L.forEach(x=>h+='<div class="tc"><b>'+esc(x.s)+' | '+esc(x.w)+'</b><div class="row"><div><span>Made</span><em>'+fmt(x.m)+'</em></div><div><span>Given</span><em>'+fmt(x.g)+'</em></div><div><span>Held</span><em style="color:var(--g)">'+fmt(x.m-x.g)+'</em></div></div><div class="bar"><i style="width:'+(x.m?Math.min(100,Math.round(100*x.g/x.m)):0)+'%"></i></div></div>');
  h+='<div class="note">Bar = given / made</div>';
 } else {
  if(!R.orders.length)h+='<div class="note">No orders issued yet.</div>';
  R.orders.forEach(o=>h+='<div class="tc"><b>Order #'+esc(o.order_no)+' | '+esc(o.stator_type||'')+' | '+esc(o.winding_type)+'</b><div class="row"><div><span>Qty</span><em>'+fmt(o.qty)+'</em></div><div><span>Wound</span><em>'+fmt(o.wound)+'</em></div><div><span>Given</span><em>'+fmt(o.given)+'</em></div></div><div class="note">Left '+fmt(Math.max(0,o.qty-o.wound))+(o.due?' | Due '+dm(o.due):'')+'</div><div class="bar"><i style="width:'+Math.min(100,Math.round(100*o.wound/o.qty))+'%"></i></div></div>');
 }
 h+='</div>';$('main').innerHTML=h;
 pick($('main'),v=>{rtab=v;report()});
}
async function route(){
 const p=(location.hash||'#made').slice(1);
 ['made','give','report'].forEach(k=>$('n_'+k).className=k===p?'on':'');
 $('who').textContent=ME;
 try{if(p==='report')await report();else{await home();entryForm(p==='give'?'give':'made')}}
 catch(e){$('main').innerHTML='<div class="card"><div class="err">'+esc(e.message)+'</div></div>'}
}
window.onhashchange=route;route();
</script></body></html>
