<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App 1 - Winding</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fffdf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#222;font-size:16px}
.w{max-width:460px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:4px 0}h2{font-size:21px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top a{color:#555;font-size:16px}
.box{border:1.5px solid #cfc9b8;border-radius:10px;padding:12px 14px;margin:12px 0;background:#e6f2ff}
.box.g{background:#e8f7e4}.box.y{background:#fff3cc}.box.p{background:#fde7ef}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{padding:5px 3px;border-bottom:1.5px dashed #888;text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-weight:normal;color:#444}
tr.tot td{border-top:2.5px solid #333;border-bottom:none;font-weight:bold}
input,select{font:inherit;font-size:19px;width:100%;padding:8px;margin:4px 0 8px;border:1px solid #b5b09f;border-radius:8px;background:#fff}
button{font:inherit;font-size:20px;padding:10px 16px;border:1.5px solid #cfc9b8;border-radius:10px;background:#fff3cc;cursor:pointer}
button.w100{width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.tabs button{flex:1 1 40%;background:#fff}.tabs button.on{background:#ffe08a}
.big{font-size:30px;font-weight:bold}.bad{color:#c0392b;font-weight:bold}.ok{color:#1e8449}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.del{padding:0 8px;font-size:16px;background:#fff;border-width:1.5px}
.err{color:#c0392b}
small,.mut{color:#666;font-size:16px}
#msg{position:sticky;top:0;background:#fff3cc;padding:6px;text-align:center;display:none;border:1px solid #b5b09f}
</style></head><body><div class="w">
<div id="msg"></div>
<div class="top"><h1 id="hd">App 1</h1><a href="#" id="lo">Log out</a></div>
<div id="sum"></div>
<div class="box y">
 <h2>New entry</h2>
 <div class="tabs" id="tabs"></div>
 <div id="form"></div>
</div>
<div class="box"><h2>Entries by date</h2><div id="list"></div></div>
<datalist id="types"></datalist>
<script>
const START='2026-10-01';
const ME=localStorage.getItem('wa_name');
const TOKEN=localStorage.getItem('wa_token');
if(!TOKEN){location.href='index.html';}
function authFetch(u,o){o=o||{};o.headers=Object.assign({},o.headers||{},{Authorization:'Bearer '+TOKEN});return fetch(u,o).then(r=>{if(r.status===401){localStorage.removeItem('wa_token');location.href='index.html'}return r})}
if(!ME||!['Suman','Dinesh','Ajeet','Siraj','Sunil'].includes(ME)){location.href='index.html';}
const OTHERS=['Suman','Dinesh','Ajeet','Siraj','Sunil'].filter(n=>n!==ME);
const NEXT=ME==='Sunil'?'Sunil':'Pandey ji';
const TABS=[['stamp_in','Manual receipt (not in Midland)'],['wound','Winding done'],['sent',ME==='Sunil'?'Ready (kept by Sunil)':'Sent to Pandey ji'],['transfer','Transfer']];
let rows=[],tab='stamp_in';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-IN');
const today=()=>{const d=new Date();const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);let s=z.toISOString().slice(0,10);return s<START?START:s};
const dm=d=>d.slice(8,10)+'/'+d.slice(5,7);
document.getElementById('lo').onclick=e=>{e.preventDefault();localStorage.removeItem('wa_token');localStorage.removeItem('wa_name');location.href='index.html'};
function msg(t){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3500)}
function calc(){
 const t={};const g=k=>t[k]||(t[k]={got:0,rec:0,wound:0,sent:0,out:0});
 rows.forEach(r=>{
  if(r.kind==='transfer'){
   if(r.contractor===ME){g(r.stype).out+=r.qty}
   if(r.party===ME){g(r.stype).got+=r.qty}
  } else if(r.contractor===ME){
   const x=g(r.stype);
   if(r.kind==='stamp_in')x.rec+=r.qty;
   if(r.kind==='wound')x.wound+=r.qty;
   if(r.kind==='sent')x.sent+=r.qty;
  }});
 Object.values(t).forEach(x=>{x.recv=x.rec+x.got-x.out;x.unp=x.recv-x.wound;x.ready=x.wound-x.sent});
 return t;
}
function render(){
 document.getElementById('hd').textContent='App 1 - '+ME;
 const t=calc();const keys=Object.keys(t).sort();
 document.getElementById('types').innerHTML=[...new Set(rows.map(r=>r.stype).filter(Boolean))].map(x=>'<option value="'+esc(x)+'">').join('');
 let T={recv:0,wound:0,unp:0,ready:0,sent:0};keys.forEach(k=>{for(const f in T)T[f]+=t[k][f]});
 let h=(note?'<div class="box err">'+esc(note)+'</div>':'')+'<div class="box g"><h2>Summary (from 1 Oct 2026)</h2>';
 if(!keys.length)h+='<div class="mut">No entries yet.</div>';
 else{h+='<table><tr><th>Type</th><th>Received</th><th>Wound</th><th>Stamping balance</th><th>Ready to send</th></tr>';
  keys.forEach(k=>{const x=t[k];h+='<tr><td>'+esc(k)+'</td><td>'+fmt(x.recv)+'</td><td>'+fmt(x.wound)+'</td><td'+(x.unp<0?' class="bad"':'')+'>'+fmt(x.unp)+'</td><td'+(x.ready<0?' class="bad"':'')+'>'+fmt(x.ready)+'</td></tr>'});
  h+='<tr class="tot"><td>Total</td><td>'+fmt(T.recv)+'</td><td>'+fmt(T.wound)+'</td><td>'+fmt(T.unp)+'</td><td>'+fmt(T.ready)+'</td></tr></table>';
  h+='<div class="mut">Stamping balance = received - wound. Ready to send = wound - sent to '+esc(NEXT)+'. Received includes stamping from Midland (automatic) and transfers between contractors.</div>';
  h+='<div class="mut">'+'Sent to '+esc(NEXT)+' so far: '+fmt(T.sent)+'</div>';}
 h+='</div>';document.getElementById('sum').innerHTML=h;
 renderTabs();renderList();
}
function renderTabs(){
 const tb=document.getElementById('tabs');tb.innerHTML='';
 TABS.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.className=k===tab?'on':'';b.onclick=()=>{tab=k;renderTabs()};tb.appendChild(b)});
 let f='<label>Stamping type</label><input id="f_type" list="types" placeholder="e.g. 6 SOOT MARUTI" autocomplete="off">';
 if(tab==='transfer')f+='<label>Transfer to</label><select id="f_party">'+OTHERS.map(n=>'<option>'+n+'</option>').join('')+'</select>';
 f+='<div class="row"><div><label>Quantity (pcs)</label><input id="f_qty" type="number" inputmode="numeric" min="1"></div><div><label>Date</label><input id="f_d" type="date" min="'+START+'" value="'+today()+'"></div></div>';
 f+='<label>Note (optional)</label><input id="f_note" maxlength="100">';
 f+='<button class="w100" id="save">Save</button><div class="err" id="ferr"></div>';
 document.getElementById('form').innerHTML=f;
 document.getElementById('save').onclick=save;
}
async function api(opt){const r=await authFetch('/api/wa',opt);const j=await r.json();if(!r.ok)throw new Error(j.error||'error');return j}
let note='';
async function load(){try{const j=await api();rows=j.rows;note='';if(j.midlandError)note='Could not load stamping from Midland: '+j.midlandError;const sk=Object.keys(j.skipped||{});if(sk.length)note+=(note?' | ':'')+'Midland shows stamping issued to these names, but they are not in this app: '+sk.join(', ');render()}catch(e){document.getElementById('sum').innerHTML='<div class="box err">Could not load: '+esc(e.message)+'</div>'}}
async function save(){
 const stype=document.getElementById('f_type').value.trim(),qty=Number(document.getElementById('f_qty').value),d=document.getElementById('f_d').value,note=document.getElementById('f_note').value;
 const err=document.getElementById('ferr');err.textContent='';
 if(!stype){err.textContent='Enter the stamping type';return}
 if(!(qty>0)){err.textContent='Enter the quantity';return}
 if(!d||d<START){err.textContent='Date must be 1 Oct 2026 or later';return}
 const t=calc()[stype]||{unp:0,ready:0};
 if((tab==='wound'||tab==='transfer')&&qty>t.unp&&!confirm('Stamping balance is '+fmt(t.unp)+' but you entered '+fmt(qty)+'. Save anyway?'))return;
 if(tab==='sent'&&qty>t.ready&&!confirm('Ready winding is '+fmt(t.ready)+' but you entered '+fmt(qty)+'. Save anyway?'))return;
 const party=tab==='transfer'?document.getElementById('f_party').value:(tab==='sent'?NEXT:null);
 const btn=document.getElementById('save');btn.disabled=true;
 try{await api({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',kind:tab,contractor:ME,party,stype,qty,d,note})});
  msg('Saved');await load()}catch(e){err.textContent=e.message;btn.disabled=false}
}
async function del(id){if(!confirm('Delete this entry?'))return;try{await api({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'del',id})});await load()}catch(e){msg(e.message)}}
function label(r){
 const nm=Object.fromEntries(TABS);nm.stamp_in='Manual receipt';
 if(r.src==='midland')return 'Received from Midland';
 if(r.kind==='transfer')return r.contractor===ME?'Transferred to '+r.party:'Transferred from '+r.contractor;
 if(r.kind==='sent')return 'Sent to '+NEXT;
 return nm[r.kind];
}
function renderList(){
 const mine=rows.filter(r=>r.kind!=='dispatch'&&(r.contractor===ME||r.party===ME&&r.kind==='transfer')).slice().reverse();
 if(!mine.length){document.getElementById('list').innerHTML='<div class="mut">Nothing yet.</div>';return}
 let h='<table><tr><th>Date</th><th>Entry</th><th>Type</th><th>Qty</th><th></th></tr>';
 mine.forEach(r=>{const canDel=r.contractor===ME&&!r.src;h+='<tr><td>'+dm(r.d)+'</td><td>'+esc(label(r))+(r.note?'<br><span class="mut">'+esc(r.note)+'</span>':'')+'</td><td>'+esc(r.stype)+'</td><td>'+fmt(r.qty)+'</td><td>'+(canDel?'<button class="del" onclick="del('+r.id+')">x</button>':'')+'</td></tr>'});
 document.getElementById('list').innerHTML=h+'</table>';
}
render();load();
</script></div></body></html>
